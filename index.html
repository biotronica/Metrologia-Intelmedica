class AuthError extends Error{constructor(){super('La sesión de Google expiró. Pulse Conectar.')}}
function conectar(){

  if(!window.google?.accounts?.oauth2)return rej(new Error('No cargó el inicio de sesión de Google. Revise su conexión.'));
  if(!tokenClient)tokenClient=google.accounts.oauth2.initTokenClient({client_id:CONFIG.CLIENT_ID,scope:CONFIG.SCOPE,callback:r=>{
   const p=pend;pend=null;if(r.error)return p?.rej(new Error('Google: '+r.error));const tk=r.access_token;
   cuentaDe(tk).then(c=>{if(!c.ok){try{google.accounts.oauth2.revoke(tk,()=>{})}catch(e){}return p?.rej(new Error(`La cuenta ${c.e} no está autorizada para esta app. Use la cuenta de la empresa.`))}
    token=tk;tokenExp=Date.now()+(r.expires_in-60)*1000;CUENTA={e:c.e,principal:c.principal};sessionStorage.setItem(KEY+'_tok',JSON.stringify({token,exp:tokenExp,c:CUENTA}));p?.res()}).catch(e=>p?.rej(e))}});
  pend={res,rej};tokenClient.requestAccessToken();

}
async function api(url,opt={}){

 const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});
 if(r.status===401){token=null;throw new AuthError()}
 if(!r.ok){const t=await r.text();let m=t;try{m=JSON.parse(t).error.message}catch(e){}throw new Error(`Error ${r.status}: ${m}`.slice(0,220))}
 return r.status===204?null:r.json();
}

 genTodos:()=>run(async()=>{for(const q of ST.eqs.filter(q=>!q.hecho&&!faltanFijos(q).length&&!vaciosOk(q))){if(!(await preguntarVacios(q)))return irAVacios(q)}render();const L=ST.eqs.filter(q=>generable(q)&&!q.hecho);let n=0;for(const q of L){try{await generar(q,m=>est(`(${n+1}/${L.length}) ${m}`));n++}catch(e){if(e instanceof AuthError)throw e;q.err=e.message;guardar()}render()}toast(`${n} de ${L.length} Excel generado(s) ✔`)}),
 regenTodos:()=>run(async()=>{const L=ST.eqs.filter(q=>q.hecho&&generable(q));if(!L.length)return;
  if(!(await dialogo('Regenerar todos',`<p>Se volverán a generar <b>${L.length}</b> Excel con los datos actuales. Los que están en Drive se reemplazan.</p>`,[{t:'🔄 Regenerar todos',v:true,cls:'navy'},{t:'Cancelar',v:false,cls:'ghost'}])))return;
  let n=0;for(const q of L){try{await generar(q,m=>est(`(${n+1}/${L.length}) ${m}`));n++}catch(e){if(e instanceof AuthError)throw e;q.err=e.message;q.hecho='';guardar()}render()}toast(`${n} de ${L.length} Excel regenerado(s) ✔`)}),
 nueva:()=>{if(ST.eqs.some(q=>!q.hecho)&&!confirm('Hay equipos sin generar. ¿Empezar de nuevo de todas formas?'))return;if(ST.eqs.some(q=>q.hecho&&!q.cel)&&!confirm('Hay Excel que no se han guardado en el celular (carpeta METROLOGIA). ¿Empezar de nuevo de todas formas?'))return;if(ST.eqs.length&&!archivar()&&!confirm('No se pudo guardar esta toma de datos en el Historial (memoria llena). ¿Empezar de nuevo de todas formas?'))return;ST.eqs.forEach(q=>idbDel(q.id).catch(()=>{}));const g={...ST.gen};ST=estadoNuevo();ST.gen.metrologo=g.metrologo;ST.gen.lugar=g.lugar;guardar();render();scrollTo(0,0)}
};
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b||b.disabled)return;if(b.tagName==='A'&&b.href)return;ev.preventDefault();ACT[b.dataset.a]?.(b.dataset.id,b)});
function refrescarLec(q,pid){
 const t=T(q),pm=new Map(PUNTOS(t).map(p=>[p.id,p]));
 document.querySelectorAll('[data-cell]:not([data-prog])').forEach(x=>{const p=pm.get(x.dataset.p);const l=p&&p.lec.find(l=>l.cell===x.dataset.cell);if(l){x.classList.remove('bad','dig','real');x.classList.toggle('nr',esNR(q,l.cell));x.classList.toggle('inc',incC(q,p,l));const c=claseFuera(q,p,l);if(c)x.classList.add(...c.split(' '))}});
 const p=pm.get(pid);if(p){const s=statsTxt(q,p);if(typeof s==='string'){const e=$('#ss_'+p.id);if(e)e.innerHTML=s}else{const a=$('#sp_'+p.id),b=$('#se_'+p.id),c=$('#ss_'+p.id);if(a)a.textContent=s.p;if(b)b.textContent=s.e;if(c)c.innerHTML=`Prom. <b>${s.p}</b> · Error <b>${s.e}</b>${mpaTxt(q,p)}`}}
 const av=$('#avisoLec');if(av)av.innerHTML=avisoLec(q);
}
ACT.celGuardar=sub=>run(async()=>{
 if(!generados().length)return toast('Primero genere los Excel','err');
 if(window.showDirectoryPicker&&!/iPhone|iPad|Android/i.test(navigator.userAgent)){
  const L=await leerGenerados();
  try{const ruta=await guardarEnCarpeta(L);marcarCel(L);toast(`${L.length} Excel guardado(s) en ${ruta} ✔`)}catch(e){if(e.name!=='AbortError')throw e}
  return;
 }
 const L=await leerGenerados(sub||'');const nom=sub||subCarpeta(L[0]?.q);
 const files=L.map(it=>new File([it.blob],it.name,{type:MIME_XLSX}));
 if(await compartir(files,'METROLOGIA › '+nom)){marcarCel(L);toast('En "Guardar en Archivos" elija METROLOGIA › '+nom)}
});
ACT.celZip=()=>run(async()=>{
 if(!generados().length)return toast('Primero genere los Excel','err');
 const L=await leerGenerados(),subs=[...new Set(L.map(it=>subCarpeta(it.q)))];
 const zip=await zipar([{path:'METROLOGIA/'},...subs.map(x=>({path:`METROLOGIA/${x}/`})),...L.map(it=>({path:`METROLOGIA/${subCarpeta(it.q)}/${it.name}`,blob:it.blob}))]);
 const f=new File([zip],`METROLOGIA${subs.length===1?' - '+subs[0]:''}.zip`,{type:'application/zip'});
 if(await compartir([f],'METROLOGIA')){marcarCel(L);toast('Guarde el ZIP en Archivos y tóquelo: se crea la carpeta METROLOGIA')}
});

// Casillas de toma de datos (lecturas, valores programados, condiciones ambientales y datos del instrumento):
// al entrar se selecciona el valor anterior, así lo que se escriba lo reemplaza. No aplica a cliente ni a
// la identificación del equipo.
const REEMPLAZA=new Set(['tIni','tFin','hIni','hFin','capacidad','resolucion','pCorte','pBlend','pCoag','pBip','division']);
const esReemplazo=el=>el&&el.tagName==='INPUT'&&(el.dataset.cell!==undefined||REEMPLAZA.has(el.dataset.q));
document.addEventListener('focusin',ev=>{const el=ev.target;
 if(el.dataset?.kpa){const q=ST.eqs.find(x=>x.id===ST.editando);if(q)el.value=val(q,el.dataset.cell)===null?(q.v?.[el.dataset.cell]??''):kpaDe(q,el.dataset.cell)}
 if(!esReemplazo(el)||!el.value)return;
 const sel=()=>{try{el.setSelectionRange(0,el.value.length)}catch(e){el.select()}};sel();setTimeout(sel,0);setTimeout(sel,60)});
document.addEventListener('mouseup',ev=>{if(esReemplazo(ev.target)&&document.activeElement===ev.target&&ev.target.selectionStart===0&&ev.target.selectionEnd===ev.target.value.length)ev.preventDefault()},true);
document.addEventListener('input',ev=>{
 const el=ev.target,d=el.dataset;
 if(el.id==='ajBloq'){AJ.bloq=+el.value||5;saveLS(KEY+'_aj',AJ);marcaAct();return}
 if(el.id==='histQ'){HQ=el.value;const l=$('#histLista');if(l)l.innerHTML=histLista();return}
 if(el.id==='drvQ'){const l=$('#drvLista');if(l)l.innerHTML=drvLista(el.value);return}
 if(el.tagName==='INPUT'&&(d.g||d.q||d.cell)&&el.type!=='date'&&el.value!==MAY(el.value)){const a=el.selectionStart,b=el.selectionEnd;el.value=MAY(el.value);try{el.setSelectionRange(a,b)}catch(e){}}
 if(d.g==='cli'||d.g==='gen'){ST[d.g][d.k]=el.value;if(d.g==='cli'&&d.k==='nombre'){const b=$('#btnSig');if(b)b.disabled=!(el.value.trim()&&ST.tpl)}guardar();return}
 if(d.conf)return;
 const q=ST.eqs.find(x=>x.id===ST.editando);if(!q)return;
 if(d.q&&el.tagName!=='SELECT')q[d.q]=el.value;else if(d.cell&&d.kpa){q.v=q.v||{};q.vk=q.vk||{};q.mpa=true;q.vk[d.cell]=el.value;const n=num(el.value);q.v[d.cell]=n===null?el.value:String(aMPa(n))}else if(d.cell){q.v=q.v||{};q.v[d.cell]=el.value}else return;
 q.hecho='';q.err='';
 if(d.q==='certificado'){const p=$('#certPrev');if(p)p.innerHTML=certPrev(q);el.classList.toggle('certbad',certMal(q))}
 if(d.cell)refrescarLec(q,d.p);
 // (v36) Sin paso automático: el usuario cambia de casilla tocándola o con Enter.
 guardar();
});
document.addEventListener('change',ev=>{
 const el=ev.target,d=el.dataset;
 if(d.q&&el.tagName==='SELECT'){const q=ST.eqs.find(x=>x.id===ST.editando);if(q){q[d.q]=el.value;q.hecho='';migrarMPa(q);guardar();render()}return}
 if(d.q&&el.tagName==='INPUT'){const q=ST.eqs.find(x=>x.id===ST.editando),x=q&&(A(q).extra||[]).find(e=>e.k===d.q);if(x&&x.nom){guardar();const y=scrollY;render();scrollTo(0,y)}return}   // v56: potencia máxima → nominales
 if(d.conf){const q=ST.eqs.find(x=>x.id===ST.editando);if(q){q.confFuera=el.checked?firmaFuera(q):'';q.hecho='';guardar()}return}
 if(d.g==='gen'&&el.tagName==='SELECT'){ST.gen[d.k]=el.value;guardar();return}
 if(d.g==='cli'&&d.k==='nombre'){const c=CLIENTES.find(x=>norm(x.nombre)===norm(el.value));if(c){if(!ST.cli.contacto)ST.cli.contacto=c.contacto;if(!ST.cli.telefono)ST.cli.telefono=c.telefono;guardar();render()}}
 if(el.id==='candSel'&&el.value){const c=ST.candidatos.find(x=>x.id===el.value);ST.carpeta={id:c.id,name:c.name,cliente:norm(ST.cli.nombre)};guardar();render()}
});
document.addEventListener('focusout',ev=>{const el=ev.target;if(el.dataset?.kpa){const q=ST.eqs.find(x=>x.id===ST.editando);if(q)el.value=fmtMPa(q.v?.[el.dataset.cell]);return}
 if(ev.target.dataset?.q!=='certificado')return;const q=ST.eqs.find(x=>x.id===ST.editando);if(q&&certOk(q)){q.certificado=cert(q);ev.target.value=q.certificado;guardar()}});
// Orden de las lecturas para pasar de casilla: cada columna de arriba hacia abajo; las columnas marcadas
// con ↓ en la tabla (1ª ↓ y 2ª ↓ de los manómetros) de abajo hacia arriba. Ventilador: en cada parámetro,
// Patrón M1→M4 y luego Equipo M1→M4.
function ordenLec(q){const t=T(q),L=[];
 SECC(t,q).forEach(sc=>{
  if(sc.render==='rows')sc.cols.forEach((c,j)=>{const col=sc.puntos.map(p=>p.lec[j].cell);L.push(...(c.includes('↓')?col.reverse():col))});
  else if(sc.render==='cols'&&sc.orden==='fila')sc.filas.forEach((f,i)=>sc.puntos.forEach(p=>p.lec[i]&&L.push(p.lec[i].cell)));   // v56: incubadora, por minuto
  else if(sc.render==='cols')sc.puntos.forEach(p=>L.push(...p.lec.map(l=>l.cell)));
  else sc.puntos.forEach(p=>['pt','eq'].forEach(k=>L.push(...p.lec.filter(l=>l.k===k).sort((a,b)=>a.m-b.m).map(l=>l.cell))))});
 return L}
function irSiguiente(el){const q=ST.eqs.find(x=>x.id===ST.editando);if(!q)return false;const L=ordenLec(q),i=L.indexOf(el.dataset.cell);
 const sig=i>=0&&L[i+1]&&$(`[data-cell="${L[i+1]}"]:not([data-prog])`);if(!sig)return false;sig.focus();sig.scrollIntoView({block:'center',behavior:'smooth'});return true}
// Al digitar una lectura, pasa sola a la siguiente casilla tras 0,5 s sin escribir (si el número está completo).
let tAvance;
function programarAvance(el){clearTimeout(tAvance);const v=String(el.value).trim();if(num(v)===null||/[.,\-]$/.test(v))return;
 tAvance=setTimeout(()=>{if(document.activeElement===el)irSiguiente(el)},500)}
document.addEventListener('focusin',ev=>{if(!ev.target.dataset?.cell)clearTimeout(tAvance)});
// Enter también pasa a la siguiente casilla (en las lecturas, en el mismo orden).
// v60: barra «NR» encima del teclado mientras se digita una lectura (el teclado numérico no tiene letras)
const NRB=document.createElement('div');NRB.id='nrBar';NRB.innerHTML='<span class="muted small" style="margin-right:auto;align-self:center">NR = No Registra</span><button class="btn sm navy" type="button" id="nrBtn">NR</button>';document.body.appendChild(NRB);
let nrEl=null;const nrPos=()=>{const v=window.visualViewport;NRB.style.top=((v?v.offsetTop+v.height:innerHeight)-NRB.offsetHeight)+'px'};
const nrPunto=el=>{const q=ST.eqs.find(x=>x.id===ST.editando);return q&&PUNTOS(T(q),q).find(p=>p.id===el.dataset.p)};
document.addEventListener('focusin',ev=>{const el=ev.target;if(el.tagName==='INPUT'&&el.dataset.cell&&!el.dataset.prog&&nrOkP(nrPunto(el))){nrEl=el;$('#nrBtn').textContent=String(el.value).trim().toUpperCase()==='NR'?'Quitar NR':'NR';NRB.style.display='flex';nrPos()}else{nrEl=null;NRB.style.display='none'}});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!document.activeElement||document.activeElement.tagName!=='INPUT'){nrEl=null;NRB.style.display='none'}},120));
window.visualViewport&&['resize','scroll'].forEach(e=>visualViewport.addEventListener(e,()=>{if(NRB.style.display!=='none')nrPos()}));
NRB.addEventListener('pointerdown',e=>e.preventDefault());NRB.addEventListener('mousedown',e=>e.preventDefault());
$('#nrBtn').addEventListener('click',()=>{const el=nrEl;if(!el||!document.body.contains(el))return;const era=String(el.value).trim().toUpperCase()==='NR';el.value=era?'':'NR';el.classList.toggle('nr',!era);el.dispatchEvent(new Event('input',{bubbles:true}));if(!era){clearTimeout(tAvance);irSiguiente(el)}else{$('#nrBtn').textContent='NR';el.focus()}});
document.addEventListener('keydown',ev=>{if(ev.key!=='Enter'||ev.target.tagName!=='INPUT')return;const el=ev.target;
 if(el.dataset.cell&&!el.dataset.prog){ev.preventDefault();clearTimeout(tAvance);irSiguiente(el);return}
 const L=[...document.querySelectorAll('.content input')];const i=L.indexOf(el);if(i>=0&&L[i+1]){ev.preventDefault();L[i+1].focus()}});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(!ESAPP){window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTP=e;const a=document.activeElement;if(!a||!/INPUT|SELECT|TEXTAREA/.test(a.tagName))render()});
 window.addEventListener('appinstalled',()=>{INSTP=null;toast('Metrología instalada ✔');const a=document.activeElement;if(!a||!/INPUT|SELECT|TEXTAREA/.test(a.tagName))render()})}
// Al abrir la app (v44): SIEMPRE empieza en blanco (paso 1, toma nueva; conserva metrólogo y lugar). Si había una toma
// con datos (cliente o equipos), se guarda antes en el 📋 Historial y en el paso 1 queda «↩ Volver a CLIENTE» para seguirla.
// No cuenta como «abrir» si la app se usó hace menos de 10 min (el iPhone a veces recarga la app al volver a ella).
if(!usoReciente()&&(ST.eqs.length||ST.cli.nombre.trim())&&archivar(true)){const g={...ST.gen},id=archivar.ultimo,cli=ST.cli.nombre;ST=estadoNuevo();ST.gen.metrologo=g.metrologo;ST.gen.lugar=g.lugar;ST.volver={id,cli};guardar();
 setTimeout(()=>toast('La toma de datos anterior quedó guardada en el 📋 Historial'),400)}
render();
if(BLOQ)bloquear();
// Pedir almacenamiento persistente y, si localStorage quedó vacío, recuperar los datos de la copia en IndexedDB.
try{navigator.storage?.persist?.()}catch(e){}
(async()=>{try{const K3=[KEY,KEY+'_hist',KEY+'_aj'];
 if(K3.every(k=>!localStorage.getItem(k))){let n=0;for(const k of [...K3,PKEY]){if(localStorage.getItem(k))continue;const t=await idbGet('__ls__'+k);if(t){localStorage.setItem(k,t);n++}}if(n)location.reload()}
 else [...K3,PKEY].forEach(k=>{const t=localStorage.getItem(k);if(t)respaldo(k,t)})}catch(e){}})();
if(conectado())run(async()=>{await cargarClientes();if(ST.paso==='cliente'&&!ST.editando&&VISTA!=='ajustes'){const a=document.activeElement;if(!a||a===document.body)render()}});
</script>
