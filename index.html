<style>

button,input,select{font-family:inherit}

.topbar{background:linear-gradient(135deg,var(--navy),var(--navy-light));color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 18px 16px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(11,37,64,.25)}

.tb-btn{background:rgba(255,255,255,.12);border:none;color:#fff;min-width:34px;height:34px;border-radius:10px;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;padding:0 8px}

.bottom{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(240,243,246,.96);backdrop-filter:blur(6px);border-top:1px solid var(--border);z-index:15}

.chip.ok{background:#e3f4ea;color:var(--success)}.chip.warn{background:#fdf1dc;color:#9a6a12}.chip.gray{background:#eef1f4;color:var(--muted)}.chip.err{background:#fbe3e5;color:var(--danger)}
.cert{display:inline-block;background:var(--navy);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;margin-right:6px}
.lec{display:grid;grid-template-columns:56px repeat(3,1fr);gap:6px;align-items:center}

.muted{color:var(--muted)}.small{font-size:12.5px}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:14px}
.status{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}
.hero{text-align:center;padding:30px 10px}.hero img{width:84px;height:84px;border-radius:20px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#16212C;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:50;max-width:92%;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}#toast.err{background:var(--danger)}
details summary{cursor:pointer;font-weight:700;color:var(--navy);font-size:14px}
</style>

 vent:{nombre:'F-48-P-SC02 PLANTILLA VENTILADOR - MAQ. ANESTESIA V3.xlsx',busca:'PLANTILLA VENTILADOR',hoja:'VENTILADOR',lab:'Laboratorio de Metrología de\nINTELMEDICA CORP ',

 lec:[['C','D'],['E','F'],['G','H'],['I','J']].flatMap(([a,b],m)=>[{cell:a+(fila0+i),k:'pt',m},{cell:b+(fila0+i),k:'eq',m}])}))});
const TIPOS={
 flujo:{archivo:'flujo',tipo:'Flujómetro',equipo:'FLUJOMETRO',check:'prog',secciones:[{titulo:'Lecturas del patrón (L/min)',render:'cols',filas:['M1','M2','M3','M4','M5'],
  puntos:['B','C','D'].map((c,j)=>({id:'n'+c,label:'Valor nominal',prog:{cell:c+'149',def:[2,10,15][j]},lec:[150,151,152,153,154].map(f=>({cell:c+f}))}))}]},
 mbaja:{archivo:'mano',tipo:'Manómetro de baja',equipo:'MANOMETRO',certHoja:'MANOMETRO BAJA MODIFICADO',check:'prog',secciones:[{titulo:'Error de indicación',render:'rows',cols:['1ª ↑','1ª ↓','2ª ↑','2ª ↓'],puntos:filasMano(56,[.075,.125,.25,.5,.75,1],[20,40,80,120,160,200])}]},
 malta:{archivo:'mano',tipo:'Manómetro de alta',equipo:'MANOMETRO',certHoja:'MANOMETRO ALTA MODIFICADO',check:'prog',secciones:[{titulo:'Error de indicación',render:'rows',cols:['1ª ↑','1ª ↓','2ª ↑','2ª ↓'],puntos:filasMano(42,[.075,.125,.25,.5,.75,1],[300,500,1000,2000,3000,4000])}]},
 mvac:{archivo:'mano',tipo:'Manovacuómetro',equipo:'MANOVACUOMETRO',certHoja:'MANOVACUOMETRO MODIFICADO',check:'prog',secciones:[{titulo:'Error de indicación',render:'rows',cols:['1ª ↑','1ª ↓','2ª ↑','2ª ↓'],puntos:filasMano(70,[.1,.2,.3,.5,.75,1],[2,4,6,10,15,20])}]},
 vent:{archivo:'vent',tipo:'Ventilador / Máq. anestesia',equipo:'VENTILADOR',check:'grupo',secciones:[confVent(1,173,[300,4.2,'NI',5,'NA',14,1.4,1,2.1]),confVent(2,186,[400,7.2,'NI',6,'NA',18,0.95,1,2.5]),confVent(3,199,[500,8,'NI',7,'NA',16,0.94,1,3])]}
};
const LUGARES=['En Sitio','Laboratorio de Metrología de INTELMEDICA CORP'];
const METROLOGOS=['JHON STIVEN DELGADO','JEISSON G. PORTILLA'];
const MIME_XLSX='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',FOLDER='application/vnd.google-apps.folder',GSHEET='application/vnd.google-apps.spreadsheet';
const DRV='https://www.googleapis.com/drive/v3/files',SH='https://sheets.googleapis.com/v4/spreadsheets/',DRVX='&supportsAllDrives=true&includeItemsFromAllDrives=true&corpora=allDrives';

/* =================== utilidades =================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'q'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dq=s=>String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const num=v=>{const s=String(v??'').trim().replace(',','.');return s!==''&&isFinite(Number(s))?Number(s):null};
const fmtN=x=>x==null?'—':(Math.round(x*1000)/1000).toLocaleString('es-CO');
const loadLS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const saveLS=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let tt;function toast(m,cls=''){const t=$('#toast');t.textContent=m;t.className='on '+cls;clearTimeout(tt);tt=setTimeout(()=>t.className='',3800)}

/* =================== estado =================== */
const KEY='metrologia_intelmedica_v1';
function estadoNuevo(){return{paso:'cliente',tpl:'',cli:{nombre:'',contacto:'',direccion:'',telefono:''},gen:{recepcion:hoy(),fecha:hoy(),lugar:'En Sitio',metrologo:METROLOGOS[0]},eqs:[],editando:'',carpeta:null}}
let ST=Object.assign(estadoNuevo(),loadLS(KEY)||{});
let AJ=Object.assign({mant:CONFIG.MANTENIMIENTOS,comp:CONFIG.COMPARTIDOS,tplIds:{}},loadLS(KEY+'_aj')||{});
const guardar=()=>saveLS(KEY,ST);
let CLIENTES=loadLS(KEY+'_cli')||[];
const T=()=>TIPOS[ST.tpl]||TIPOS.flujo;
const A=()=>ARCHIVOS[T().archivo];
const PUNTOS=t=>t.secciones.flatMap(sc=>sc.puntos);
function eqNuevo(prev){const t=T(),v={};PUNTOS(t).forEach(p=>{v[p.prog.cell]=prev?.v?.[p.prog.cell]??String(p.prog.def)});
 const q={id:uid(),certificado:'',acred:prev?.acred||'',equipo:t.equipo,marca:'',modelo:'',serie:'',activo:'',ubicacion:prev?.ubicacion||'',tIni:prev?.tIni||'',tFin:prev?.tFin||'',hIni:prev?.hIni||'',hFin:prev?.hFin||'',v,hecho:'',err:''};
 (A().extra||[]).forEach(x=>q[x.k]=prev?.[x.k]||'');return q}
// Borradores de la versión anterior (solo flujómetro): se pasan al formato nuevo.
(function migrar(){let c=false;(ST.eqs||[]).forEach(q=>{if(q.v||!q.nom)return;q.v={};['B','C','D'].forEach((col,j)=>{q.v[col+'149']=String(q.nom[j]??'');(q.lec[j]||[]).forEach((x,i)=>q.v[col+(150+i)]=x)});delete q.nom;delete q.lec;c=true});if(c&&!ST.tpl)ST.tpl='flujo'})();
// N.º de certificado: sticker NO acreditado → número-AA (año de calibración), p. ej. 42710-26;
// sticker ACREDITADO → solo el número, p. ej. 42710.
const aa=()=>(ST.gen.fecha||hoy()).slice(2,4);
const cert=q=>{const s=String(q.certificado||'').trim().replace(/\s+/g,'');if(!s)return'';const m=/^(\d+)(?:-(\d{2}))?$/.exec(s);if(!m)return s;return q.acred==='si'?m[1]:m[1]+'-'+(m[2]||aa())};
const certOk=q=>q.acred==='si'?/^\d+$/.test(cert(q)):q.acred==='no'&&/^\d+-\d{2}$/.test(cert(q));
const certRep=q=>!!cert(q)&&ST.eqs.some(x=>x!==q&&cert(x)===cert(q));
const val=(q,c)=>num(q.v?.[c]);
// Puntos obligatorios: con valor programado numérico. En ventiladores, los parámetros NA/NI son
// opcionales, pero si se llena una lectura hay que llenar las ocho.
const obligatorio=(t,q,p)=>t.check==='prog'||val(q,p.prog.cell)!==null||p.lec.some(l=>String(q.v[l.cell]??'').trim()!=='');
const faltanLec=(q)=>{const t=T();return PUNTOS(t).filter(p=>obligatorio(t,q,p)).reduce((a,p)=>a+p.lec.filter(l=>val(q,l.cell)===null).length,0)};
const faltaProg=q=>{const t=T();return t.check==='prog'&&PUNTOS(t).some(p=>val(q,p.prog.cell)===null)};
// Manovacuómetro: la capacidad máxima es de vacío, se escribe con "-" delante automáticamente.
const capNeg=x=>ST.tpl==='mvac'&&x.k==='capacidad';
const faltaExtra=q=>(A().extra||[]).filter(x=>x.num?num(q[x.k])===null:!String(q[x.k]||'').trim()).map(x=>x.l.replace(' *','').toLowerCase());
const faltan=q=>[!q.acred&&'tipo de sticker (acreditado / no acreditado)',!String(q.certificado).trim()&&'N.º de certificado',q.acred&&String(q.certificado).trim()&&!certOk(q)&&(q.acred==='si'?'N.º de certificado válido (solo números)':'N.º de certificado válido (número-AA)'),certRep(q)&&'certificado repetido',!String(q.serie).trim()&&'serie',...faltaExtra(q),faltaProg(q)&&'valores nominales',(n=>n&&n+' lectura(s)')(faltanLec(q))].filter(Boolean);
const completo=q=>!faltan(q).length;
// Lectura sospechosa (±10 %): en flujómetros y manómetros contra el valor nominal; en ventiladores
// contra las demás lecturas del mismo parámetro (patrón y equipo por separado), porque el valor
// real puede diferir del programado.
const TOL=0.10;
const mediana=a=>{const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
function fuera(q,p,l){const t=T(),v=val(q,l.cell);if(v===null)return false;
 if(t.check==='prog'){const n=val(q,p.prog.cell);return n!==null&&n!==0&&Math.abs(v-n)/Math.abs(n)>TOL}
 const g=p.lec.filter(x=>x.k===l.k).map(x=>val(q,x.cell)).filter(x=>x!==null);if(g.length<3)return false;const md=mediana(g);return md!==0&&Math.abs(v-md)/Math.abs(md)>TOL}
const celdasFuera=q=>PUNTOS(T()).flatMap(p=>p.lec.filter(l=>fuera(q,p,l)).map(l=>l.cell+'='+q.v[l.cell]+'/'+(q.v[p.prog.cell]??'')));
const nFuera=q=>celdasFuera(q).length;
// Firma de las lecturas en rojo: si se cambia alguna, la confirmación deja de valer.
const firmaFuera=q=>celdasFuera(q).join(';');
const confirmado=q=>!nFuera(q)||q.confFuera===firmaFuera(q);
const generable=q=>completo(q)&&confirmado(q);
const prom=(q,cells)=>{const v=cells.map(c=>val(q,c)).filter(x=>x!==null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
function statsTxt(q,p){const t=T();
 if(t.check==='grupo'){const pt=prom(q,p.lec.filter(l=>l.k==='pt').map(l=>l.cell)),eq=prom(q,p.lec.filter(l=>l.k==='eq').map(l=>l.cell));return`Prom. patrón <b>${fmtN(pt)}</b> · Prom. equipo <b>${fmtN(eq)}</b> · Error <b>${fmtN(pt!=null&&eq!=null?eq-pt:null)}</b>`}
 const pr=prom(q,p.lec.map(l=>l.cell)),n=val(q,p.prog.cell);return{p:fmtN(pr),e:fmtN(pr!=null&&n!=null?(t.archivo==='flujo'?n-pr:pr-n):null)}}
const chip=q=>!q.hecho&&!confirmado(q)?'<span class="chip err">Revisar</span>':q.hecho?'<span class="chip ok">Generado</span>':q.err?'<span class="chip err">Error</span>':completo(q)?'<span class="chip warn">Listo</span>':'<span class="chip gray">Incompleto</span>';

/* =================== Google =================== */
let token=null,tokenExp=0,tokenClient=null,pend=null;
try{const t=JSON.parse(sessionStorage.getItem(KEY+'_tok'));if(t&&t.exp>Date.now()){token=t.token;tokenExp=t.exp}}catch(e){}
const conectado=()=>!!token&&Date.now()<tokenExp;
class AuthError extends Error{constructor(){super('La sesión de Google expiró. Pulse Conectar.')}}
function conectar(){
 return new Promise((res,rej)=>{
  if(!window.google?.accounts?.oauth2)return rej(new Error('No cargó el inicio de sesión de Google. Revise su conexión.'));
  if(!tokenClient)tokenClient=google.accounts.oauth2.initTokenClient({client_id:CONFIG.CLIENT_ID,scope:CONFIG.SCOPE,callback:r=>{
   if(r.error)pend?.rej(new Error('Google: '+r.error));else{token=r.access_token;tokenExp=Date.now()+(r.expires_in-60)*1000;sessionStorage.setItem(KEY+'_tok',JSON.stringify({token,exp:tokenExp}));pend?.res()}pend=null}});
  pend={res,rej};tokenClient.requestAccessToken();
 });
}
async function api(url,opt={}){
 if(!conectado())throw new AuthError();
 const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});
 if(r.status===401){token=null;throw new AuthError()}
 if(!r.ok){const t=await r.text();let m=t;try{m=JSON.parse(t).error.message}catch(e){}throw new Error(`Error ${r.status}: ${m}`.slice(0,220))}
 return r.status===204?null:r.json();
}
async function driveList(q){let out=[],pt='';do{const r=await api(`${DRV}?q=${encodeURIComponent(q)}&fields=nextPageToken,files(id,name,mimeType,parents)&pageSize=1000${pt?'&pageToken='+encodeURIComponent(pt):''}${DRVX}`);out=out.concat(r.files||[]);pt=r.nextPageToken||''}while(pt&&out.length<3000);return out}
const driveMeta=id=>api(`${DRV}/${encodeURIComponent(id)}?fields=id,name,mimeType,parents&supportsAllDrives=true`);
async function descargar(id){const r=await fetch(`${DRV}/${encodeURIComponent(id)}?alt=media&supportsAllDrives=true`,{headers:{Authorization:'Bearer '+token}});if(r.status===401){token=null;throw new AuthError()}if(!r.ok)throw new Error('No se pudo descargar la plantilla (HTTP '+r.status+')');return r.blob()}
async function subir(blob,meta,mime,fileId){
 const b='mt'+Math.random().toString(36).slice(2),m={...meta};if(fileId)delete m.parents;
 const body=new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`,JSON.stringify(m),`\r\n--${b}\r\nContent-Type: ${mime}\r\n\r\n`,blob,`\r\n--${b}--`]);
 return api(`https://www.googleapis.com/upload/drive/v3/files${fileId?'/'+encodeURIComponent(fileId):''}?uploadType=multipart&supportsAllDrives=true&fields=id,name`,{method:fileId?'PATCH':'POST',body,headers:{'Content-Type':'multipart/related; boundary='+b}});
}
async function subcarpeta(padre,nombre){

 const f=fs.find(x=>norm(x.name)===norm(nombre));if(f)return f.id;
 return (await api(`${DRV}?supportsAllDrives=true&fields=id`,{method:'POST',body:JSON.stringify({name:nombre,mimeType:FOLDER,parents:[padre]})})).id;
}

async function generar(q,est){
 const t=T(),a=A(),C=a.celdas,K=ST.cli,G=ST.gen;
 if(!completo(q))throw new Error('Faltan datos en el equipo');
 if(!confirmado(q))throw new Error('Hay lecturas fuera de ±10 % sin corregir ni confirmar');
 est('Buscando la carpeta del cliente…');
 // Destino: Documentos compartidos › METROLOGIA › tipo de equipo (las carpetas se crean si no existen).
 const cMet=await subcarpeta(AJ.comp||CONFIG.COMPARTIDOS,CONFIG.CARPETA_METRO),cAnio=await subcarpeta(cMet,subCarpeta());
 est('Copiando la plantilla oficial…');
 const tpl=await plantilla();
 const nombre=`${cert(q)} ${t.tipo.replace(/ \/.*$/,'')} ${q.serie&&!/^ni$/i.test(q.serie)?q.serie:(q.activo||'NI')}`.replace(/[\\/:*?"<>|#%]+/g,'-').trim();
 const tmp=await subir(tpl,{name:nombre+' (temporal)',parents:[cAnio],mimeType:GSHEET},MIME_XLSX);
 try{
  const meta=await api(SH+tmp.id+'?fields=sheets.properties(sheetId,title,hidden)');
  const hoja=(meta.sheets.find(s=>s.properties.title.trim()===a.hoja)||meta.sheets[0]).properties.title;
  const d=[],put=(a,v)=>d.push({range:`'${hoja}'!${a}`,values:[[v]]}),txt=v=>{v=String(v??'').trim();return v===''?'NI':v};
  put(C.nombre,K.nombre.trim());put(C.contacto,K.contacto);put(C.direccion,K.direccion);put(C.telefono,K.telefono);
  put(C.lugar,G.lugar==='En Sitio'?'En Sitio':a.lab);if(G.metrologo)put(C.metrologo,G.metrologo);put(C.recepcion,G.recepcion);put(C.fecha,G.fecha);put(C.certificado,"'"+cert(q));
  ['tIni','tFin','hIni','hFin'].forEach(k=>{const n=num(q[k]);put(C[k],n===null?'':n)});
  put(C.equipo,txt(q.equipo));put(C.serie,txt(q.serie));put(C.marca,txt(q.marca));put(C.activo,txt(q.activo));put(C.modelo,txt(q.modelo));put(C.ubicacion,txt(q.ubicacion));
  (a.extra||[]).forEach(x=>put(x.cell,x.num?(capNeg(x)&&num(q[x.k])!==null?-Math.abs(num(q[x.k])):num(q[x.k])):String(q[x.k]||'')));
  PUNTOS(t).forEach(p=>{const pv=String(q.v[p.prog.cell]??'').trim();put(p.prog.cell,num(pv)!==null?num(pv):(pv||'NI'));p.lec.forEach(l=>{const n=val(q,l.cell);put(l.cell,n===null?'':n)})});
  est('Escribiendo los datos…');
  await api(SH+tmp.id+'/values:batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'USER_ENTERED',data:d})});
  // Manómetros: se deja visible la hoja del certificado que corresponde al tipo elegido.
  if(t.certHoja){const h=meta.sheets.find(s=>s.properties.title.trim()===t.certHoja);if(h&&h.properties.hidden)await api(SH+tmp.id+':batchUpdate',{method:'POST',body:JSON.stringify({requests:[{updateSheetProperties:{properties:{sheetId:h.properties.sheetId,hidden:false},fields:'hidden'}}]})})}
  est('Guardando el Excel…');
  const r=await fetch(`${DRV}/${encodeURIComponent(tmp.id)}/export?mimeType=${encodeURIComponent(MIME_XLSX)}`,{headers:{Authorization:'Bearer '+token}});
  if(!r.ok)throw new Error('No se pudo exportar a Excel (HTTP '+r.status+')');
  const ex=await driveList(`'${dq(cAnio)}' in parents and name='${dq(nombre+'.xlsx')}' and trashed=false`);
  const blob=await r.blob();
  const fx=await subir(blob,{name:nombre+'.xlsx',parents:[cAnio]},MIME_XLSX,ex[0]?.id);
  q.hecho=`https://drive.google.com/file/d/${fx.id}/view`;q.err='';q.cel='';q.archivo=nombre+'.xlsx';guardar();
  idbPut(q.id,{name:nombre+'.xlsx',blob}).catch(()=>{});
 }finally{api(`${DRV}/${encodeURIComponent(tmp.id)}?supportsAllDrives=true`,{method:'DELETE'}).catch(()=>{})}
}

// Los Excel generados se guardan también en el dispositivo (IndexedDB) para poder pasarlos a Archivos.
const IDB='metrologia_archivos';
function idbAbrir(){return new Promise((ok,ko)=>{const r=indexedDB.open(IDB,1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)})}
async function idbOp(modo,fn){const db=await idbAbrir();return new Promise((ok,ko)=>{const tx=db.transaction('f',modo),st=tx.objectStore('f');const r=fn(st);tx.oncomplete=()=>{ok(r&&r.result);db.close()};tx.onerror=()=>{ko(tx.error);db.close()}})}
const idbPut=(k,v)=>idbOp('readwrite',st=>st.put(v,k));
const idbGet=k=>idbOp('readonly',st=>st.get(k));
const idbDel=k=>idbOp('readwrite',st=>st.delete(k));
const subCarpeta=()=>(T()?.tipo||'Equipos').replace(/[\\/:*?"<>|]/g,'-').trim();
async function archivoDe(q){
 let a=null;try{a=await idbGet(q.id)}catch(e){}
 if(a&&a.blob)return{name:a.name,blob:a.blob};
 const id=/\/d\/([^/]+)/.exec(q.hecho||'')?.[1];if(!id)throw new Error('No se encontró el Excel de '+cert(q));
 const r=await fetch(`${DRV}/${encodeURIComponent(id)}?alt=media&supportsAllDrives=true`,{headers:{Authorization:'Bearer '+token}});
 if(r.status===401){token=null;throw new AuthError()}
 if(!r.ok)throw new Error('No se pudo descargar el Excel de Drive (HTTP '+r.status+')');
 const blob=await r.blob(),name=q.archivo||(cert(q)+' '+q.equipo+'.xlsx');idbPut(q.id,{name,blob}).catch(()=>{});return{name,blob};
}
// ZIP sin compresión (método "store"): al abrirlo en Archivos crea METROLOGIA/<tipo>/…
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
async function zipar(items){
 const enc=new TextEncoder(),partes=[],dir=[];let off=0;const d=new Date();
 const tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
 for(const it of items){
  const nb=enc.encode(it.path),data=it.blob?new Uint8Array(await it.blob.arrayBuffer()):new Uint8Array(0),crc=crc32(data);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nb.length,true);
  partes.push(h.buffer,nb,data);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nb.length,true);c.setUint32(38,it.path.endsWith('/')?16:0,true);c.setUint32(42,off,true);
  dir.push(c.buffer,nb);off+=30+nb.length+data.length;
 }
 const tam=dir.reduce((a,x)=>a+(x.byteLength??x.length),0),e=new DataView(new ArrayBuffer(22));
 e.setUint32(0,0x06054b50,true);e.setUint16(8,items.length,true);e.setUint16(10,items.length,true);e.setUint32(12,tam,true);e.setUint32(16,off,true);
 return new Blob([...partes,...dir,e.buffer],{type:'application/zip'});
}
function bajarArchivo(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}

}

const avisoLec=q=>{const n=nFuera(q);if(!n)return'';return`<div class="aviso">⚠ ${n} lectura(s) fuera de ±10 % ${T().check==='prog'?'del valor nominal':'de las demás lecturas del mismo parámetro'}.<br>• Si fue un <b>error de escritura</b>, corrija la casilla en rojo.<br>• Si la lectura es <b>real</b> (el equipo está fuera de tolerancia), confírmelo:<label style="display:flex;gap:8px;align-items:center;margin:8px 0 0;color:var(--danger)"><input type="checkbox" data-conf="1" style="width:22px;height:22px;margin:0" ${confirmado(q)?'checked':''}> Confirmo que las lecturas en rojo son reales y se deben certificar así</label></div>`};
const inC=(q,p,l)=>`<input data-cell="${l.cell}" data-p="${p.id}" value="${esc(q.v[l.cell]??'')}" inputmode="decimal" placeholder="—" class="${fuera(q,p,l)?'bad':''}">`;
const inP=(q,p)=>`<input data-cell="${p.prog.cell}" data-p="${p.id}" data-prog="1" value="${esc(q.v[p.prog.cell]??'')}" ${T().check==='prog'?'inputmode="decimal"':''}>`;
function seccionHtml(q,t,sc){
 if(sc.render==='cols'){const P=sc.puntos;return`<div class="card"><div class="card-title">${esc(sc.titulo)}</div><div class="lec" style="grid-template-columns:56px repeat(${P.length},minmax(0,1fr))"><span></span>${P.map(p=>`<span class="h">${esc(p.label)}</span>`).join('')}
  <b>Nominal</b>${P.map(p=>inP(q,p)).join('')}
  ${sc.filas.map((f,i)=>`<b>${f}</b>`+P.map(p=>inC(q,p,p.lec[i])).join('')).join('')}
  <b>Prom.</b>${P.map(p=>`<span class="st" id="sp_${p.id}">${statsTxt(q,p).p}</span>`).join('')}
  <b>Error</b>${P.map(p=>`<span class="st" id="se_${p.id}">${statsTxt(q,p).e}</span>`).join('')}</div></div>`}
 if(sc.render==='rows'){return`<div class="card"><div class="card-title">${esc(sc.titulo)}${q.unidades?' ('+esc(q.unidades)+')':''}</div><div class="lec lec5" style="grid-template-columns:40px repeat(5,minmax(0,1fr))"><span class="h">% rango</span><span class="h">Valor IBC</span>${sc.cols.map(c=>`<span class="h">${c}</span>`).join('')}
  ${sc.puntos.map(p=>`<b style="font-size:12px">${p.label}</b>${inP(q,p)}${p.lec.map(l=>inC(q,p,l)).join('')}<span></span><span class="muted small" style="grid-column:span 5;margin:-2px 0 6px" id="ss_${p.id}">${(s=>`Prom. <b>${s.p}</b> · Error <b>${s.e}</b>`)(statsTxt(q,p))}</span>`).join('')}</div>
  <p class="muted small" style="margin:8px 0 0">Valor IBC: valor del instrumento en cada punto. Lecturas del patrón sin corregir: 1ª y 2ª serie, creciente (↑) y decreciente (↓).</p></div>`}
 return`<div class="card"><div class="card-title">${esc(sc.titulo)}</div>${sc.puntos.map(p=>`<div class="vp"><div class="vph"><b>${esc(p.label)}</b><label>Programado ${inP(q,p)}</label></div>
  <div class="lec" style="grid-template-columns:44px repeat(2,minmax(0,1fr))"><span></span><span class="h">Patrón (Ept)</span><span class="h">Equipo (EBP)</span>
  ${[0,1,2,3].map(m=>`<b>M${m+1}</b>${p.lec.filter(l=>l.m===m).map(l=>inC(q,p,l)).join('')}`).join('')}</div>
  <div class="muted small" style="margin-top:6px" id="ss_${p.id}">${statsTxt(q,p)}</div></div>`).join('')}
  <p class="muted small" style="margin:8px 0 0">Si un parámetro no se mide, deje Programado en NA o NI y sus lecturas vacías.</p></div>`}
function vEditor(){
 const q=ST.eqs.find(x=>x.id===ST.editando),t=T();if(!q){ST.editando='';return render()}
 const qi=(k,l,x='')=>`<label>${l}<input data-q="${k}" value="${esc(q[k])}" ${x}></label>`;
 const i=ST.eqs.indexOf(q);
 return topbar(`${esc(t.tipo)} ${i+1}`,esc(ST.cli.nombre),'cerrarEditor')+`<div class="content">
 <div class="card"><div class="card-title">Certificado e identificación</div>
 <div class="small" style="font-weight:600;margin-bottom:6px">Sticker *</div><div class="tipos" style="margin-bottom:12px">${[['si','Acreditado','Solo el número · 42710'],['no','No acreditado','Número-AA · 42710-'+aa()]].map(([k,t,d])=>`<button type="button" class="tipo ${q.acred===k?'on':''}" data-a="acred" data-id="${k}"><b>${t}</b><span class="small muted">${d}</span></button>`).join('')}</div>
 ${qi('certificado','N.º de certificado *'+(q.acred==='no'?' (el -AA del año se agrega solo)':''),'inputmode="numeric" placeholder="Ej. 42710"')}<div class="small" id="certPrev" style="margin:-6px 0 12px">${certPrev(q)}</div>
 <div class="g2">${qi('equipo','Equipo')}${qi('marca','Fabricante / marca')}${qi('modelo','Modelo')}${qi('serie','Serie * (NI si no tiene)')}${qi('activo','N.º interno / activo','placeholder="NI"')}${qi('ubicacion','Ubicación')}</div></div>
 <div class="card"><div class="card-title">Condiciones ambientales</div>
 <div class="g2">${qi('tIni','Temp. inicial (°C)','inputmode="decimal"')}${qi('tFin','Temp. final (°C)','inputmode="decimal"')}${qi('hIni','HR inicial (%)','inputmode="decimal"')}${qi('hFin','HR final (%)','inputmode="decimal"')}</div></div>
 ${(A().extra||[]).length?`<div class="card"><div class="card-title">Datos del instrumento</div><div class="g2">${A().extra.map(x=>x.opts?`<label>${x.l}<select data-q="${x.k}"><option value="">—</option>${x.opts.map(o=>`<option ${q[x.k]===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`:capNeg(x)?`<label>${x.l}<div class="negw"><span>−</span><input data-q="${x.k}" value="${esc(String(q[x.k]||'').replace(/^\s*[-−]\s*/,''))}" inputmode="decimal" placeholder="Ej. 30"></div></label>`:qi(x.k,x.l,'inputmode="decimal"')).join('')}</div></div>`:''}
 ${t.secciones.map(sc=>seccionHtml(q,t,sc)).join('')}
 <div class="card" style="padding:12px 16px"><div id="avisoLec">${avisoLec(q)}</div>
 <p class="muted small" style="margin:${nFuera(q)?'10px':'0'} 0 0">Las casillas en rojo se alejan más del 10 % ${t.check==='prog'?'del valor nominal':'de las demás lecturas del mismo parámetro'}: revise si están bien digitadas. Los resultados definitivos los calcula la plantilla oficial.</p></div>
 <button class="btn dan block" data-a="quitar">Quitar este equipo</button></div>
 <div class="bottom"><div class="in"><button class="btn ghost" data-a="agregarOtro">+ Otro</button><button class="btn navy" data-a="cerrarEditor">Listo ✓</button></div></div>`;
}
function vGenerar(){
 const listos=ST.eqs.filter(q=>generable(q)&&!q.hecho).length,inc=ST.eqs.filter(q=>!completo(q)).length;
 return topbar('Generar',`Paso 3 de 3 · ${esc(ST.cli.nombre)}`,'atrasEquipos')+`<div class="content">
 <div class="card"><div class="card-title">Carpeta de destino en Drive</div>
 <div class="small">📁 Documentos compartidos › <b>${CONFIG.CARPETA_METRO}</b> › <b>${esc(subCarpeta())}</b></div>
 <div class="muted small" style="margin-top:4px">Si las carpetas no existen, la app las crea.</div></div>
 <div class="card"><div class="card-title">Equipos</div>
 ${ST.eqs.map(q=>`<div class="eq" style="cursor:default"><div class="main"><div class="t">${q.certificado?`<span class="cert">${esc(cert(q))}</span>`:''}${esc(q.equipo)} · S/N ${esc(q.serie||'—')}</div><div class="s">${q.err?`<span style="color:var(--danger)">${esc(q.err)}</span>`:q.hecho?`<a href="${esc(q.hecho)}" target="_blank" rel="noopener">📄 Abrir Excel en Drive</a>`:!confirmado(q)?`<span style="color:var(--danger)">${nFuera(q)} lectura(s) fuera de ±10 %: corrija o confirme en el equipo</span>`:completo(q)?(nFuera(q)?'Listo · lecturas fuera de tolerancia confirmadas':'Listo para generar'):'Falta: '+esc(faltan(q).join(', '))}</div></div>${chip(q)}${generable(q)?`<button class="btn sm ${q.hecho?'ghost':''}" data-a="gen1" data-id="${q.id}">${q.hecho?'Rehacer':'Generar'}</button>`:`<button class="btn sm ghost" data-a="editar" data-id="${q.id}">${completo(q)?'Revisar':'Completar'}</button>`}</div>`).join('')}
 <div class="status" id="estado"></div></div>
 ${inc?`<p class="muted small">${inc} equipo(s) incompleto(s) no se generan.</p>`:''}
 ${celCard()}
 <div class="card"><div class="card-title">Terminar</div><p class="muted small" style="margin-top:0">Cuando todos estén generados, puede empezar una toma de datos nueva para otro cliente. Los Excel quedan en Drive${generados().some(q=>!q.cel)?' — <b>ojo:</b> hay Excel que aún no se han guardado en el celular':''}.</p><button class="btn ghost block" data-a="nueva">Nueva toma de datos</button></div></div>
 <div class="bottom"><div class="in"><button class="btn ghost" data-a="atrasEquipos">‹ Equipos</button><button class="btn" data-a="genTodos" ${listos?'':'disabled'}>⚙️ Generar ${listos} Excel</button></div></div>`;
}
function vAjustes(){
 return topbar('Ajustes','Metrología Intelmedica','cerrarAjustes')+`<div class="content"><div class="card"><div class="card-title">Drive</div>
 <label>ID de la carpeta "Documentos compartidos" (ahí se crea METROLOGIA)<input id="ajComp" value="${esc(AJ.comp||CONFIG.COMPARTIDOS)}"></label>
 <label>ID de la carpeta de clientes (MANTENIMIENTOS, para autocompletar)<input id="ajMant" value="${esc(AJ.mant)}"></label>
 ${Object.entries(ARCHIVOS).map(([k,p])=>`<label>ID de ${esc(p.nombre.replace(/\.xlsx$/,''))} (vacío = buscarla sola)<input data-tplid="${k}" value="${esc(AJ.tplIds[k]||'')}"></label>`).join('')}
 <button class="btn navy block" data-a="guardarAjustes">Guardar</button></div>
 <div class="card"><div class="card-title">Sesión</div><p class="muted small" style="margin-top:0">${conectado()?'Conectado a Google.':'Sin conexión con Google.'}</p><button class="btn ghost block" data-a="conectar">${conectado()?'Volver a conectar':'Conectar con Google'}</button></div>
 <div class="card"><details><summary>Cómo funciona</summary><ol class="small muted"><li>Datos del cliente y de la calibración, una sola vez.</li><li>Primero se elige el tipo de equipo (flujómetro, manómetro de baja o de alta, manovacuómetro o ventilador) y se usa su plantilla.</li><li>Cada equipo: N.º de certificado, identificación, condiciones ambientales y lecturas.</li><li>Generar: se copia la plantilla oficial, se escriben los datos en sus celdas de entrada y se guarda el Excel en Drive › Documentos compartidos › ${CONFIG.CARPETA_METRO} › tipo de equipo. Las fórmulas y la gráfica de la plantilla calculan el certificado.</li></ol></details></div></div>`;
}
let VISTA='';
function render(){
 const V=VISTA==='ajustes'?vAjustes:ST.editando?vEditor:{cliente:vCliente,equipos:vEquipos,generar:vGenerar}[ST.paso]||vCliente;
 $('#app').innerHTML=V();
}

/* =================== acciones =================== */
async function run(fn){try{return await fn()}catch(e){console.error(e);if(e instanceof AuthError){token=null;render()}toast(e.message||String(e),'err')}}
const est=m=>{const e=$('#estado');if(e)e.textContent=m};
const ACT={
 conectar:()=>run(async()=>{await conectar();render();toast('Conectado a Google ✔');await cargarClientes();render()}),
 ajustes:()=>{VISTA='ajustes';render();scrollTo(0,0)},
 cerrarAjustes:()=>{VISTA='';render()},
 guardarAjustes:()=>{AJ.mant=$('#ajMant').value.trim()||CONFIG.MANTENIMIENTOS;AJ.comp=$('#ajComp').value.trim()||CONFIG.COMPARTIDOS;document.querySelectorAll('[data-tplid]').forEach(i=>{AJ.tplIds[i.dataset.tplid]=i.value.trim()});saveLS(KEY+'_aj',AJ);ST.carpeta=null;guardar();VISTA='';render();toast('Ajustes guardados')},
 paso:id=>{ST.paso=id;guardar();render();scrollTo(0,0)},
 tipo:id=>{if(ST.tpl===id)return;if(ST.eqs.length&&!confirm('Cambiar el tipo de equipo borra los '+ST.eqs.length+' equipo(s) de esta toma de datos. ¿Continuar?'))return;if(ST.eqs.length)ST.eqs=[];ST.tpl=id;guardar();const y=scrollY;render();scrollTo(0,y)},
 atrasCliente:()=>ACT.paso('cliente'),atrasEquipos:()=>ACT.paso('equipos'),
 agregar:()=>{const q=eqNuevo(ST.eqs[ST.eqs.length-1]);ST.eqs.push(q);ST.editando=q.id;guardar();render();scrollTo(0,0);setTimeout(()=>$('[data-q=certificado]')?.focus(),60)},
 acred:id=>{const q=ST.eqs.find(x=>x.id===ST.editando);if(!q)return;q.acred=id;const m=/^(\d+)/.exec(String(q.certificado||'').trim());if(m)q.certificado=id==='si'?m[1]:cert(q);guardar();const y=scrollY;render();scrollTo(0,y)},
 agregarOtro:()=>{ST.editando='';ACT.agregar()},
 editar:id=>{ST.editando=id;guardar();render();scrollTo(0,0)},
 cerrarEditor:()=>{ST.editando='';guardar();render();scrollTo(0,0)},
 quitar:()=>{if(!confirm('¿Quitar este equipo de la toma de datos?'))return;ST.eqs=ST.eqs.filter(q=>q.id!==ST.editando);ST.editando='';guardar();render()},
 usarCarpeta:()=>run(async()=>{const u=$('#destUrl').value.trim();const id=(/folders\/([^/?#]+)/.exec(u)||[])[1]||(/[?&]id=([^&#]+)/.exec(u)||[])[1]||u;if(!id)return;const f=await driveMeta(id);if(f.mimeType!==FOLDER)throw new Error('El enlace no es de una carpeta');ST.carpeta={id:f.id,name:f.name,cliente:norm(ST.cli.nombre)};guardar();render();toast('Carpeta seleccionada')}),
 gen1:id=>run(async()=>{const q=ST.eqs.find(x=>x.id===id);if(!generable(q))return toast('Corrija o confirme las lecturas en rojo antes de generar','err');try{await generar(q,est);toast('Excel generado ✔')}catch(e){q.err=e.message;guardar();throw e}finally{render()}}),
 genTodos:()=>run(async()=>{const L=ST.eqs.filter(q=>generable(q)&&!q.hecho);let n=0;for(const q of L){try{await generar(q,m=>est(`(${n+1}/${L.length}) ${m}`));n++}catch(e){q.err=e.message;guardar();if(e instanceof AuthError)throw e}render()}toast(`${n} de ${L.length} Excel generado(s) ✔`)}),
 nueva:()=>{if(ST.eqs.some(q=>!q.hecho)&&!confirm('Hay equipos sin generar. ¿Empezar de nuevo de todas formas?'))return;if(ST.eqs.some(q=>q.hecho&&!q.cel)&&!confirm('Hay Excel que no se han guardado en el celular (carpeta METROLOGIA). ¿Empezar de nuevo de todas formas?'))return;ST.eqs.forEach(q=>idbDel(q.id).catch(()=>{}));const g={...ST.gen};ST=estadoNuevo();ST.gen.metrologo=g.metrologo;ST.gen.lugar=g.lugar;guardar();render();scrollTo(0,0)}
};
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b||b.disabled)return;if(b.tagName==='A'&&b.href)return;ev.preventDefault();ACT[b.dataset.a]?.(b.dataset.id,b)});
function refrescarLec(q,pid){
 const t=T(),pm=new Map(PUNTOS(t).map(p=>[p.id,p]));
 document.querySelectorAll('[data-cell]:not([data-prog])').forEach(x=>{const p=pm.get(x.dataset.p);const l=p&&p.lec.find(l=>l.cell===x.dataset.cell);if(l)x.classList.toggle('bad',fuera(q,p,l))});
 const p=pm.get(pid);if(p){const s=statsTxt(q,p);if(typeof s==='string'){const e=$('#ss_'+p.id);if(e)e.innerHTML=s}else{const a=$('#sp_'+p.id),b=$('#se_'+p.id),c=$('#ss_'+p.id);if(a)a.textContent=s.p;if(b)b.textContent=s.e;if(c)c.innerHTML=`Prom. <b>${s.p}</b> · Error <b>${s.e}</b>`}}
 const av=$('#avisoLec');if(av)av.innerHTML=avisoLec(q);
}
ACT.celGuardar=()=>run(async()=>{
 if(!generados().length)return toast('Primero genere los Excel','err');
 const L=await leerGenerados();
 if(window.showDirectoryPicker&&!/iPhone|iPad|Android/i.test(navigator.userAgent)){
  try{const ruta=await guardarEnCarpeta(L);marcarCel(L);toast(`${L.length} Excel guardado(s) en ${ruta} ✔`)}catch(e){if(e.name!=='AbortError')throw e}
  return;
 }
 const files=L.map(it=>new File([it.blob],it.name,{type:MIME_XLSX}));
 if(await compartir(files,'METROLOGIA › '+subCarpeta())){marcarCel(L);toast('En "Guardar en Archivos" elija METROLOGIA › '+subCarpeta())}
});
ACT.celZip=()=>run(async()=>{
 if(!generados().length)return toast('Primero genere los Excel','err');
 const L=await leerGenerados(),sub=subCarpeta();
 const zip=await zipar([{path:'METROLOGIA/'},{path:`METROLOGIA/${sub}/`},...L.map(it=>({path:`METROLOGIA/${sub}/${it.name}`,blob:it.blob}))]);
 const f=new File([zip],`METROLOGIA - ${sub}.zip`,{type:'application/zip'});
 if(await compartir([f],'METROLOGIA')){marcarCel(L);toast('Guarde el ZIP en Archivos y tóquelo: se crea la carpeta METROLOGIA › '+sub)}
});
document.addEventListener('input',ev=>{
 const el=ev.target,d=el.dataset;
 if(d.g==='cli'||d.g==='gen'){ST[d.g][d.k]=el.value;if(d.g==='cli'&&d.k==='nombre'){const b=$('#btnSig');if(b)b.disabled=!(el.value.trim()&&ST.tpl)}guardar();return}
 if(d.conf)return;
 const q=ST.eqs.find(x=>x.id===ST.editando);if(!q)return;
 if(d.q&&el.tagName!=='SELECT')q[d.q]=el.value;else if(d.cell){q.v=q.v||{};q.v[d.cell]=el.value}else return;
 q.hecho='';q.err='';
 if(d.q==='certificado'){const p=$('#certPrev');if(p)p.innerHTML=certPrev(q)}
 if(d.cell)refrescarLec(q,d.p);
 guardar();
});
document.addEventListener('change',ev=>{
 const el=ev.target,d=el.dataset;
 if(d.q&&el.tagName==='SELECT'){const q=ST.eqs.find(x=>x.id===ST.editando);if(q){q[d.q]=el.value;q.hecho='';guardar();render()}return}
 if(d.conf){const q=ST.eqs.find(x=>x.id===ST.editando);if(q){q.confFuera=el.checked?firmaFuera(q):'';q.hecho='';guardar()}return}
 if(d.g==='gen'&&el.tagName==='SELECT'){ST.gen[d.k]=el.value;guardar();return}
 if(d.g==='cli'&&d.k==='nombre'){const c=CLIENTES.find(x=>norm(x.nombre)===norm(el.value));if(c){if(!ST.cli.contacto)ST.cli.contacto=c.contacto;if(!ST.cli.telefono)ST.cli.telefono=c.telefono;guardar();render()}}
 if(el.id==='candSel'&&el.value){const c=ST.candidatos.find(x=>x.id===el.value);ST.carpeta={id:c.id,name:c.name,cliente:norm(ST.cli.nombre)};guardar();render()}
});
document.addEventListener('focusout',ev=>{if(ev.target.dataset?.q!=='certificado')return;const q=ST.eqs.find(x=>x.id===ST.editando);if(q&&certOk(q)){q.certificado=cert(q);ev.target.value=q.certificado;guardar()}});
// Entre lecturas: Enter pasa a la siguiente casilla (útil en el celular).
document.addEventListener('keydown',ev=>{if(ev.key!=='Enter'||ev.target.tagName!=='INPUT')return;const L=[...document.querySelectorAll('.content input')];const i=L.indexOf(ev.target);if(i>=0&&L[i+1]){ev.preventDefault();L[i+1].focus()}});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
if(conectado())run(async()=>{await cargarClientes();if(ST.paso==='cliente'&&!ST.editando&&VISTA!=='ajustes'){const a=document.activeElement;if(!a||a===document.body)render()}});
</script>
</body>
</html>
